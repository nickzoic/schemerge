name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with test dependencies
        run: python -m pip install ".[test]"

      - name: Run the test suite
        run: python -m pytest -ra

      - name: Smoke-test the installed command
        run: |
          cd "$RUNNER_TEMP"
          echo '{"tags": ["a", "b"]}' > base.json
          echo '{"tags": ["a", "X"]}' > v1.json
          echo '{"tags": ["a", "Y"]}' > v2.json
          schemerge --version
          schemerge base.json v1.json v2.json --compact -o merged.json
          test "$(cat merged.json)" = '{"tags":["a","X","Y"]}'
