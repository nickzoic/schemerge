[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "schemerge"
version = "1.0.0"
description = "Schema-aware structural diff and N-way merge of JSON documents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4.18"]

[project.scripts]
schemerge = "schemerge.cli:main"

[tool.setuptools]
packages = ["schemerge"]

[tool.setuptools.package-data]
schemerge = ["metaschema.json"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
